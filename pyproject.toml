[project]
name = "mutabiq"
version = "0.1.0"
description = "Arabic search normalization, aliases and an evaluation harness"
readme = "README.md"
authors = [
    { name = "osamaps", email = "osamams518@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
extend-exclude = ["research"]
