name: Bug report
description: Something is broken or behaves wrongly
labels: ["bug"]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mutabiq version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: postgres
    attributes:
      label: PostgreSQL version
      placeholder: "17.2"
    validations:
      required: true
  - type: textarea
    id: locale
    attributes:
      label: Database locale
      description: "Output of `SELECT datcollate, datctype FROM pg_database WHERE datname = current_database();`"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `mutabiq doctor`
      render: text
